# Render's free plan puts a service to sleep after 15 idle minutes, and waking it takes about a minute.
# This pings the game every 10 minutes so judges never meet a cold start. Set the repository variable
# VAULT_URL (Settings → Secrets and variables → Actions → Variables) to the service's address.
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.VAULT_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.VAULT_URL }}/api/health"
